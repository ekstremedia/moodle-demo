services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run ./bin/setup first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:${MOODLE_PORT:-8080}:80"
    volumes:
      - moodle_data:/var/moodledata
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  cron:
    build: .
    env_file: .env
    command: ["/usr/local/bin/moodle-cron"]
    volumes:
      - moodle_data:/var/moodledata
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  moodle_data:
